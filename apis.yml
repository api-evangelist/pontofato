name: PontoFato
description: >-
  Brazilian address/location-intelligence API mapping CEP (postal code) or address to IBGE CNEFE census points with
  latitude/longitude, joined with Receita Federal business establishments. Offers proximity/radius search, full-text
  street search, and companies-at-location lookups. Agent-first provider with a hosted MCP server and llms.txt.
