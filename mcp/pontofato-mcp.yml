tools:
- name: api_index
  description: 'The API index: each route and how to connect the MCP.'
  source_operation: openapi/pontofato-openapi-original.json#api_index
- name: health
  description: Service availability and the address coverage by state (UF).
  source_operation: openapi/pontofato-openapi-original.json#health
- name: cep
  description: The addresses of a CEP (Brazilian postal code), with latitude and longitude.
  required:
  - cep
  source_operation: openapi/pontofato-openapi-original.json#cep
- name: proximo
  description: The address nearest to a latitude and longitude. A missing or empty value does not become
    zero. `(0,0)` is in the Gulf of Guinea, and the tool uses it only when you send it.
  required:
  - lat
  - lon
  source_operation: openapi/pontofato-openapi-original.json#proximo
- name: buscar
  description: 'Finds a street by name (or by neighborhood) in Brazil, up to 20 results: one for each
    street in each city. When the query has a house number that exists, the result has the point of that
    number.'
  required:
  - q
  source_operation: openapi/pontofato-openapi-original.json#buscar
- name: unidades
  description: The units at a CEP (apartment, store), with the complement and the type, in pages. The
    CEP lookup groups the addresses by street and number; this tool returns each unit. Without `logradouro`
    and `numero`, it pages through the whole CEP.
  required:
  - cep
  source_operation: openapi/pontofato-openapi-original.json#unidades
- name: empresas
  description: The companies registered at a CEP, up to 50 per page.
  required:
  - cep
  source_operation: openapi/pontofato-openapi-original.json#empresas
- name: raio
  description: The CEPs within N meters of a point (a CEP, or a latitude and longitude), with the distance
    and the addresses. Free.
  source_operation: openapi/pontofato-openapi-original.json#raio
- name: vizinhanca
  description: The active, opened and closed companies within a radius in meters, by CNAE (activity code),
    with the recent openings and the distance.
  source_operation: openapi/pontofato-openapi-original.json#vizinhanca
- name: contact
  description: 'Write to the people behind the product: a question, or a sponsorship/partnership/advertising
    proposal. One route for a question and for a sponsorship, partnership or ad proposal (`tipo`, with
    the placements of `GET /api/partners`). One message every 10 seconds per network: one that arrives
    sooner waits its turn and then goes out — no error. The message reaches the team by e-mail, with `email`
    as the reply address. For voice, send multipart/form-data: `dados` is this JSON (up to 32 KiB), and
    `audio` is one WebM, Ogg or M4A audio file (up to 2 MB). Audio can replace message. The browser records
    up to two minutes. Audio is attached to the owner''s e-mail.'
  required:
  - name
  - email
  - message
  source_operation: openapi/pontofato-openapi-original.json#contact
- name: consulta_cadastro
  description: Name, status, activity and address of a Brazilian company by CNPJ. It does not count against
    the daily free limit, does not show contacts or partners and runs no extra checks. The origin's protection
    limit still applies. For sanctions, tax status and a live CNIA check, use consulta_cnpj.
- name: consulta_endereco
  description: Addresses and companies at a CEP (Brazilian postal code), without counting against the
    daily free limit. Up to 20 addresses and 20 companies; `pontos_total` has the total number of addresses.
    The origin's protection limit still applies.
- name: consulta_sugerir
  description: Suggests up to 8 Brazilian companies for a CNPJ, company name, partner, phone or e-mail,
    ordered by how well they match. It does not count against the daily free limit and does not show contacts.
    `incompleto` means one of the sources did not answer.
- name: consulta_cnpj
  description: 'Brazilian company record by CNPJ from the Federal Revenue (Receita Federal), with the
    special status when there is one (bankruptcy, judicial recovery, liquidation); its sanctions (CEIS,
    CNEP, CEPIM, leniency agreements, TCU and the CNJ''s CNIA, checked live); partners on the politically
    exposed persons list (CGU); tax status (federal tax debt, installment agreements, tax incentives and
    construction works); the Federal Revenue chronic tax debtor list (`devedorContumaz.consta`: barred
    from public tenders); environmental and labor risk (forced-labor list, Ibama embargoes and fines);
    government contracts (PNCP, federal contracts since 2013 and sales to municipalities in the state
    of SP, from TCE-SP) and BNDES financing; registrations with regulators and official registries (CVM,
    Central Bank, ANS, ANTT, ANP, ANEEL, Anatel, Anvisa, CNES, Cadastur, Ibama, ANAC and SICAF); CVM investment
    funds; and the address on the map (CNEFE/IBGE). Accepts the numeric and the alphanumeric CNPJ. Personal
    data in the record comes masked. `sancoes` has what public registries record against the whole company
    (the CNPJ root), updated daily: useful to vet suppliers. 10 free lookups per day per network; after
    that, the tool answers `free_limit` with `resets_at`.'
- name: consulta_cep
  description: Addresses at a CEP (Brazilian postal code) with coordinates (CNEFE/IBGE) and the companies
    registered there. Returns up to 20 addresses and up to 20 companies; the total number of addresses
    is in `pontos_total`. 10 free lookups per day per network; after that, the tool answers `free_limit`
    with `resets_at`.
- name: sugerir
  description: Suggestions for a partial CEP or a street name, with the neighborhood and the city. Up
    to eight places. A CEP accepts a prefix of 3 to 8 digits, with an optional hyphen after the fifth
    digit. A street search accepts an optional state (UF) and city. One address represents each CEP; the
    full lookup returns the others. The reference is CNEFE 2022, and it does not certify the current postal
    CEP.
